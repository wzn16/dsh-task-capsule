<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-task-capsule">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1e293b"/>
  <!-- 胶囊本体：会话 header 右侧那颗 -->
  <rect x="10" y="18" width="44" height="14" rx="7" fill="#e2e8f0"/>
  <!-- 三个状态点：运行 / 等你确认 / 失败 -->
  <circle cx="18" cy="25" r="3" fill="#22c55e"/>
  <circle cx="28" cy="25" r="3" fill="#f59e0b"/>
  <circle cx="38" cy="25" r="3" fill="#ef4444"/>
  <!-- 账本：胶囊记账，下面的横线是账页 -->
  <rect x="14" y="40" width="28" height="3.5" rx="1.75" fill="#94a3b8"/>
  <rect x="14" y="47" width="18" height="3.5" rx="1.75" fill="#64748b"/>
</svg>
